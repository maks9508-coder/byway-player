<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ByWay Short player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* The video's own still frame. The whole warm-up happens behind it, so the
     chrome YouTube paints while loading is never seen. */
  #cover {
    position: absolute; inset: 0; z-index: 3; background: #000 center/cover no-repeat;
    transition: opacity .25s ease; opacity: 1;
  }
  #cover.gone { opacity: 0; pointer-events: none; }
  /* Swallows taps, so YouTube's own pause/seek UI can never be reached. */
  #shield { position: absolute; inset: 0; z-index: 4; background: transparent; -webkit-tap-highlight-color: transparent; }
  #msg {
    position: absolute; inset: 0; display: none; place-items: center; padding: 24px; z-index: 5;
    color: rgba(255,255,255,0.75); font: 13px/1.5 -apple-system, system-ui, sans-serif; text-align: center;
  }
</style>
</head>
<body>
<div id="player"></div>
<div id="cover"></div>
<div id="shield"></div>
<div id="msg"></div>
<script>
// ByWay Short player shim.
//
// Why this page exists: iOS reserves the https scheme, so a Capacitor app is
// always served from capacitor://localhost. WKWebView sends no Referer for a
// custom scheme, and YouTube refuses to embed without one — error 153,
// "embedder identity missing referrer". Loading the player from this page,
// served over real https, gives the YouTube iframe a referrer it accepts.
//
// ─── What was measured about YouTube's chrome ─────────────────────────────
//   • it appears while the embed loads, with or without any API call of ours
//   • controls=0 does not suppress it; a desktop user agent does not either
//   • it times out on its own ~4s after playback starts
//   • pause/resume brings it back — but a seek DURING playback does not
//   • a playlist (the usual way to loop) is what adds the skip buttons
//
// So: the player warms up MUTED behind the still frame while its card is still
// off screen. Once the chrome has timed out the page marks itself "armed" and
// waits. When the app says the card is on screen, one step rewinds to frame
// zero, turns sound on and uncovers — instant, from the beginning, nothing but
// video on screen. Looping rewinds just BEFORE the end, never after it.

var params     = new URLSearchParams(location.search);
var VIDEO_ID   = (params.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
var WANT_SOUND = params.get('mute') !== '1';
var CHROME_HIDE_MS = parseInt(params.get('warm') || '4200', 10);

var cover  = document.getElementById('cover');
var shield = document.getElementById('shield');
var msgEl  = document.getElementById('msg');

var player = null;
var muted  = true;            // the player is ALWAYS created muted
var armed  = false;           // chrome gone; a seek is now invisible
var startRequested = false;   // app asked to start before we were armed
var loopTimer = null;

if (VIDEO_ID) {
  // "oar" is the original-aspect thumbnail YouTube generates for non-16:9
  // videos — the true vertical frame of a Short. hqdefault is the fallback.
  cover.style.backgroundImage =
    "url(https://i.ytimg.com/vi/" + VIDEO_ID + "/oardefault.jpg), " +
    "url(https://i.ytimg.com/vi/" + VIDEO_ID + "/hqdefault.jpg)";
}

function toParent(event, extra) {
  try {
    parent.postMessage(Object.assign({ source: 'byway-player', event: event }, extra || {}), '*');
  } catch (e) { /* standalone */ }
}
function showMessage(text) { msgEl.textContent = text; msgEl.style.display = 'grid'; }
function revealVideo() { cover.classList.add('gone'); }

// Loop by rewinding a moment BEFORE the end, while the video is still playing.
// Waiting for ENDED means YouTube has already put its end screen up, and
// restarting from there both stalls and re-summons the chrome.
function startLoopWatch() {
  if (loopTimer) return;
  loopTimer = setInterval(function () {
    try {
      var d = player.getDuration(), t = player.getCurrentTime();
      // allowSeekAhead=false: seek only inside what is already buffered. A
      // Short is fully buffered by the time it reaches its end, so this jumps
      // straight to frame 0 without a new request — and without the buffering
      // state that makes YouTube paint its chrome again. Passing true here is
      // what made the loop point flash the header and pause button.
      if (d > 1 && t >= d - 0.35) player.seekTo(0, false);
    } catch (e) {}
  }, 250);
}

// Arming must be driven by how much the video has ACTUALLY PLAYED, not by a
// wall-clock timer. A pre-warmed card is off screen, and an off-screen iframe
// gets its playback throttled — the clock ran out while nothing had played, so
// the chrome had never even appeared yet, and it showed up over the video right
// after the user swiped in. Counting real playback makes the wait mean what it
// is supposed to mean: "YouTube's chrome has had its four seconds and gone".
// Accumulated, so a video shorter than the timeout still arms across loops.
var playedMs = 0;
var audioArmed = false;
var armWatch = null;
function startArmWatch() {
  if (armWatch) return;
  var last = Date.now();
  armWatch = setInterval(function () {
    var now = Date.now(), dt = now - last;
    last = now;
    try {
      if (player.getPlayerState() === YT.PlayerState.PLAYING) playedMs += dt;
      // Do the audio switch EARLY, while still hidden: unMute() summons the
      // chrome, so it has to happen with enough warm-up left for that chrome to
      // time out again. Volume stays at 0, so nothing is audible until the card
      // is really on screen — the visible moment then only raises the volume.
      if (!audioArmed && playedMs > 400) {
        audioArmed = true;
        // Order matters: unMute() restores the volume the player had before it
        // was muted — 100 — so unmuting first makes the hidden card audible for
        // the gap until setVolume lands. That gap is exactly what was heard
        // over the card being watched. Volume to zero FIRST, then unmute.
        try { player.setVolume(0); player.unMute(); player.setVolume(0); } catch (err) {}
      }
    } catch (e) { return; }
    if (playedMs < CHROME_HIDE_MS) return;
    clearInterval(armWatch); armWatch = null;
    armed = true;
    toParent('armed');
    if (startRequested) startNow();
  }, 200);
}

// Legal only once armed — before that, a seek would summon the chrome we hid.
function startNow() {
  try {
    // Everything noisy already happened while this card was hidden. Measured:
    // showing the player changes nothing on its own, but unMute() and
    // playVideo() make YouTube repaint its header and pause button — which is
    // why they are done during the warm-up, not here. All that is left for the
    // visible moment is a volume change (silent, no UI) and an in-buffer
    // rewind (proven silent by the loop).
    player.seekTo(0, false);
    if (WANT_SOUND) { player.setVolume(100); muted = false; }
    if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
  } catch (e) {}
  startLoopWatch();
  revealVideo();
  toParent('playing', { muted: muted });
}

function setMuted(next) {
  if (!player) return;
  try {
    if (next) player.mute(); else { player.unMute(); player.setVolume(100); }
    muted = next;
    toParent('sound', { muted: muted });
  } catch (e) {}
}

// nocover=1 — diagnostic only: drop the still frame immediately so a probe can
// see exactly what the player is doing underneath it.
if (params.get('nocover') === '1') revealVideo();
if (!VIDEO_ID) showMessage('No video requested.');

window.onYouTubeIframeAPIReady = function () {
  if (!VIDEO_ID) return;
  player = new YT.Player('player', {
    videoId: VIDEO_ID,
    playerVars: {
      autoplay: 1,
      // ALWAYS muted at creation. A player created unmuted starts with sound
      // before any call of ours can land — which is exactly how a pre-warmed
      // card was audible over the card being watched. Sound is turned on in
      // startNow(), never here.
      mute: 1,
      playsinline: 1,      // stay inline, never iOS fullscreen
      controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1,
      iv_load_policy: 3    // no annotation overlays
      // deliberately NO loop/playlist: a playlist is what adds skip buttons
    },
    events: {
      onReady: function (e) {
        e.target.playVideo();          // warm up, muted, behind the cover
        toParent('ready');
        startArmWatch();
        // Standalone (opened directly, no app around it): just play.
        if (window.parent === window) setTimeout(startNow, CHROME_HIDE_MS + 150);
      },
      onStateChange: function (e) {
        if (e.data === YT.PlayerState.PLAYING) toParent('state-playing', { muted: muted });
        // Backstop: the pre-emptive rewind should mean we never get here.
        if (e.data === YT.PlayerState.ENDED) {
          try { player.seekTo(0, false); player.playVideo(); } catch (err) {}
        }
      },
      onError: function (e) {
        revealVideo();
        showMessage('Video unavailable (code ' + e.data + ')');
        toParent('error', { code: e.data });
      }
    }
  });
};

// The shield eats taps meant for YouTube's UI. Its one other job: if sound was
// blocked, the tap landing here is a real gesture in THIS frame — the only kind
// allowed to turn audio on.
shield.addEventListener('click', function (ev) {
  ev.stopPropagation();
  if (muted && WANT_SOUND && armed) setMuted(false);
});

window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || d.target !== 'byway-player' || !player) return;
  // Swap the clip inside the ALREADY WARM player instead of creating a new
  // one. YouTube paints its chrome when a player is constructed; if it does not
  // repaint on loadVideoById, one long-lived player can serve every card —
  // instant, clean, and still the real clip for that place.
  if (d.action === 'load' && d.videoId) {
    var id = String(d.videoId).replace(/[^A-Za-z0-9_-]/g, '');
    try {
      player.loadVideoById({ videoId: id });
      if (WANT_SOUND && !muted) player.setVolume(100);
      toParent('loaded', { videoId: id });
    } catch (e) {}
  }
  if (d.action === 'start')  { if (armed) startNow(); else startRequested = true; }
  if (d.action === 'pause')  { try { player.pauseVideo(); } catch (e) {} }
  if (d.action === 'play')   { try { player.playVideo(); } catch (e) {} }
  if (d.action === 'mute')   { setMuted(true); }
  if (d.action === 'unmute') { setMuted(false); }
});

var s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
s.onerror = function () { showMessage('Could not load the YouTube player.'); toParent('error', { code: 'api' }); };
document.head.appendChild(s);
</script>
</body>
</html>
